<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <title>Edit Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="preload" href="../assets/css/styles.css" as="style">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="preload" href="../assets/custom.css" as="style">
    <link rel="stylesheet" href="../assets/custom.css" media="print" onload="this.media='all'">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" as="style">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
        media="print" onload="this.media='all'">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" as="style">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" media="print"
        onload="this.media='all'">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
</head>

<body class="bg-light-gray">

    <div id="headerContainer" class="bg-light-gray"></div>
    <div
        class="container bg-white border border-white rounded-4 border-2 py-4 px-5 text-center my-5 formShadowGray formFitContent">

        <div class="row">
            <div class="h1 text-black momo-trust-display-regular mb-4">My profile</div>
        </div>
        <div class="row m-5 text-center">
            <div class="col-12 col-lg-6 pe-0">
                <div><img src="../assets/imgs/avatar.svg" class="img-fluid avatar" alt=""></div>
                <div>
                    <label class="form-label nuno fw-semibold" for="">Upload profile picture</label>
                    <input type="file" class="form-control w-50 m-auto">
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <form action="" class="d-flex flex-column">
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="" class="form-label">Name</label>
                        <input type="text" class="form-control border-dark-grey border-2 formInputSize p-3"
                            value="John Doe">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="" class="form-label">Email</label>
                        <input type="email" class="form-control border-dark-grey border-2 formInputSize p-3"
                            value="john@gmail.com">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="" class="form-label">Phone</label>
                        <input type="text" class="form-control border-dark-grey border-2 formInputSize p-3"
                            value="+359888888888">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="" class="form-label">Bio</label>
                        <textarea name="" class="form-control formInputSize" rows="3"
                            id="">Big dog lover and coffee drinker</textarea>
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="" class="form-label">Address</label>
                        <input type="text" class="form-control border-dark-grey border-2 formInputSize p-3"
                            value="str. Tsar Osvoboditel 3">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="" class="form-label">New password</label>
                        <input type="password" class="form-control border-dark-grey border-2 formInputSize p-3">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="" class="form-label">Repeat new password</label>
                        <input type="password" class="form-control border-dark-grey border-2 formInputSize p-3">
                    </div>
                </form>
            </div>
        </div>

        <div class="row mt-3 justify-content-center">
            <a class="btn btn-red rounded-pill mb-3 text-nunito-regular profileBtnWidth text-white"
                href="./profile.html">Save
                changes</a>
        </div>

    </div>

    <div id="footerContainer"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../assets/index.js" defer></script>
</body>

</html>
