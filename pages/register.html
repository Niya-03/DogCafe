<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="preload" href="../assets/css/styles.css" as="style">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="preload" href="../assets/custom.css" as="style">
    <link rel="stylesheet" href="../assets/custom.css" media="print" onload="this.media='all'">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" as="style">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
        media="print" onload="this.media='all'">
</head>

<body class="bg-light-gray">

    <div id="headerContainer" class="bg-light-gray"></div>
    <main>
        <div class="container reveal">
            <div class="row justify-content-center">
                <div
                    class="bg-white border border-white rounded-4 border-2 py-4 px-5 text-center my-5 formShadowGray formFitContent">
                    <div class="h1 text-black momo-trust-display-regular mb-4">Register</div>
                    <form action="">
                        <input type="text" class="form-control mb-3 border-dark-grey border-2 formInputSize p-3"
                            placeholder="Name" id="name">
                        <input type="email" class="form-control mb-3 border-dark-grey border-2 formInputSize p-3"
                            placeholder="Email" id="email">
                        <input type="text" class="form-control mb-3 border-dark-grey border-2 formInputSize p-3"
                            placeholder="Phone number" id="phone">
                        <input type="password" class="form-control mb-3 border-dark-grey border-2 formInputSize p-3"
                            placeholder="Password" id="password">
                        <input type="password" class="form-control border-dark-grey border-2 formInputSize p-3"
                            placeholder="Repeat password" id="re-password">
                        <button class="btn btn-red rounded-pill px-4 mt-4 mb-3 text-nunito-regular text-white">Sign
                            up</button>
                    </form>

                    <div class="text-nunito-regular">Have a profile already? Log in <a href="login.html" aria-label="Go to login page">here</a></div>
                </div>
            </div>

        </div>
    </main>
    <div id="footerContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../assets/index.js" defer></script>
</body>

</html>
