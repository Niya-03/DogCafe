<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <title>Reserve</title>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="preload" href="../assets/css/styles.css" as="style">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="preload" href="../assets/custom.css" as="style">
    <link rel="stylesheet" href="../assets/custom.css" media="print" onload="this.media='all'">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" as="style">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
        media="print" onload="this.media='all'">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" as="style">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" media="print"
        onload="this.media='all'">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
</head>

<body class="bg-light-gray">

    <div id="headerContainer" class="bg-light-gray"></div>
    <main>
        <div
            class="container bg-white border border-white rounded-4 border-2 py-4 px-3 text-center my-5 formShadowGray formFitContent reveal">
            <div class="row">
                <div class="h1 text-black momo-trust-display-regular mb-4">Reserve</div>
            </div>

            <div class="row justify-content-center px-lg-4 px-3">
                <form action="" class="d-flex flex-column formFitContent ">
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" class="form-control border-dark-grey border-2 formInputSize p-3 px-5"
                            value="">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control border-dark-grey border-2 formInputSize p-3 px-5"
                            value="">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" id="phone" class="form-control border-dark-grey border-2 formInputSize p-3 px-5"
                            value="">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="date-and-time" class="form-label">Date and time</label>
                        <input id="datetime" id="date-and-time"
                            class="form-control border-dark-grey border-2 formInputSize p-3"
                            placeholder="Select date and time">
                    </div>
                    <div class="mb-3 text-start text-nunito-bold fw-semibold">
                        <label for="dog" class="form-label">Choose your dog date</label>
                        <select class="form-select border-dark-grey border-2" id="dog">
                            <option selected>I'm feeling lucky :)</option>
                            <option value="1">Mark</option>
                            <option value="2">Cari</option>
                            <option value="3">Jack</option>
                            <option value="4">Stormi</option>
                            <option value="5">Meivi</option>
                            <option value="6">Gremlin</option>
                            <option value="7">Dinosaur</option>
                            <option value="8">Lord Farquaad</option>
                        </select>
                    </div>
                    <div class="row mt-3 justify-content-center">
                        <button
                            class="btn btn-red rounded-pill mb-3 text-nunito-regular profileBtnWidth text-white">Reserve</button>
                    </div>
                </form>
            </div>


        </div>
    </main>
    <div id="footerContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../assets/index.js" defer></script>
    <script defer>
        document.addEventListener("DOMContentLoaded", function () {
            flatpickr("#datetime", {
                enableTime: true,
                dateFormat: "Y-m-d H:i",
            });
        });
    </script>
</body>

</html>
